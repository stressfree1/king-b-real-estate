{% extends 'properties/base.html' %}

{% block title %}
    Check Your Email | King B Real Estate
{% endblock %}

{% block content %}

<div style="
    min-height: 80vh;
    background: #f5f6f4;
    padding: 70px 20px;
">

    <div style="
        max-width: 550px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    ">

        <div style="
            font-size: 50px;
            margin-bottom: 15px;
        ">
            ✉️
        </div>

        <h1 style="color: #0b2e22;">
            Check Your Email
        </h1>

        <p style="
            color: #666;
            line-height: 1.7;
        ">
            If an account exists with the email address
            you entered, password reset instructions
            have been sent.
        </p>

        <a
            href="{% url 'skilled_worker_login' %}"
            style="
                display: inline-block;
                margin-top: 20px;
                padding: 13px 22px;
                background: #0b2e22;
                color: white;
                border-radius: 8px;
                text-decoration: none;
                font-weight: 700;
            "
        >
            Back to Login
        </a>

    </div>

</div>

{% endblock %}
