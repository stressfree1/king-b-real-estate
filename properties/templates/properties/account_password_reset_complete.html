{% extends "properties/base.html" %}

{% block title %}
    Password Changed | KING B REAL ESTATE
{% endblock %}


{% block content %}

<style>

.password-complete-page {

    min-height: 75vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 55px 20px;

    background: #f5f7f4;
}


.password-complete-card {

    width: min(560px, 100%);

    padding: 45px 30px;

    background: #ffffff;

    border: 1px solid #e1e8e3;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 22px 60px
        rgba(8,39,30,.08);
}


.password-complete-icon {

    width: 68px;

    height: 68px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #e7f4ed;

    color: #123c2f;

    font-size: 27px;
}


.password-complete-card h1 {

    margin: 0 0 12px;

    color: #123c2f;

    font-size: 32px;

    font-weight: 800;
}


.password-complete-card p {

    max-width: 470px;

    margin: 0 auto;

    color: #69746f;

    font-size: 13px;

    line-height: 1.8;
}


.password-complete-login {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 46px;

    margin-top: 24px;

    padding: 0 20px;

    border-radius: 9px;

    background: #123c2f;

    color: #ffffff;

    text-decoration: none;

    font-size: 11px;

    font-weight: 900;
}


.password-complete-login:hover {

    background: #b58b3b;

    color: #ffffff;
}

</style>


<section class="password-complete-page">

    <div class="password-complete-card">

        <div class="password-complete-icon">
            ✓
        </div>


        <h1>
            Password Updated
        </h1>


        <p>

            Your password has been changed successfully.
            You can now sign in using your new password.

        </p>


        <a
            href="{% url 'site_login' %}"
            class="password-complete-login"
        >

            Continue to Login →

        </a>

    </div>

</section>

{% endblock %}
